[project]
name = "logops-agent"
version = "0.1.0"
description = "智能运维排障 Agent 平台：FastAPI SSE + LangGraph + 混合RAG(BM25+Qdrant+RRF) + 只读MCP工具 + 网关客户端"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "httpx>=0.27.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "python-dotenv>=1.0.1",
    "tenacity>=8.5.0",
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "qdrant-client>=1.11.0",
    "rank-bm25>=0.2.2",
    "mcp>=1.0.0",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
